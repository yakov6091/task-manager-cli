info:
  name: Add task
  type: http

http:
  method: POST
  url: http://localhost:4000/tasks/add
  body:
    type: json
    data: |-
      {
        "title": "hello",
        "description": "s",
        "isComplete": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
